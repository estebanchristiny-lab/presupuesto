<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuesto Esteban & Andrea</title>
<style>
  body { font-family: sans-serif; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
  h1 { font-size: 28px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
  p  { color: #64748b; margin-bottom: 40px; font-size: 15px; }
  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px 40px; text-align: center; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.06); transition: all .2s; width: 220px; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.1); }
  .card .emoji { font-size: 48px; margin-bottom: 16px; }
  .card h2 { font-size: 17px; font-weight: 600; color: #1a202c; margin-bottom: 8px; }
  .card p  { font-size: 13px; color: #94a3b8; margin: 0; }
  .card.personal { border-top: 4px solid #10b981; }
  .card.familiar { border-top: 4px solid #f59e0b; }
</style>
</head>
<body>
  <h1>💰 Presupuesto Familiar</h1>
  <p>Esteban & Andrea · Sistema de gestión financiera</p>
  <div class="cards">
    <a href="personal.html" class="card personal">
      <div class="emoji">💼</div>
      <h2>Presupuesto Personal</h2>
      <p>Ingresos, gastos, ahorros e inversiones de Esteban</p>
    </a>
    <a href="familiar.html" class="card familiar">
      <div class="emoji">🏠</div>
      <h2>Presupuesto Familiar</h2>
      <p>Gastos del hogar compartidos entre Esteban & Andrea</p>
    </a>
  </div>
</body>
</html>
